---
- name: Install GNU Stow
  community.general.pacman:
    name:
      - stow
      - git
    state: present

- name: Sync and symlink dotfiles
  become: false
  block:
    - name: Clone dotfiles repository
      ansible.builtin.git:
        repo: "{{ dotfiles_repo }}"
        dest: "/home/{{ target_user }}/.dotfiles"
        update: true

    - name: Symlink configs using GNU Stow
      ansible.builtin.shell:
        cmd: "stow -v --adopt -d /home/{{ target_user }}/.dotfiles -t /home/{{ target_user }} *"
        chdir: "/home/{{ target_user }}/.dotfiles"
      register: stow_run
      changed_when: "'LINK' in stow_run.stderr"
